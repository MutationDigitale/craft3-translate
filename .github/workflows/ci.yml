name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  php:
    name: Lint and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Coding standards
        run: composer check-cs

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        db: [mysql, mariadb, pgsql]
        include:
          - db: mysql
            image: mysql:8.0
            port: 3306
            dsn: mysql:host=127.0.0.1;port=3306;dbname=tests
            health: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          - db: mariadb
            image: mariadb:10.11
            port: 3306
            dsn: mysql:host=127.0.0.1;port=3306;dbname=tests
            health: --health-cmd="healthcheck.sh --connect --innodb_initialized"
          - db: pgsql
            image: postgres:16
            port: 5432
            dsn: pgsql:host=127.0.0.1;port=5432;dbname=tests
            health: --health-cmd="pg_isready -U root -d tests"
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tests
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tests
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: tests
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          ${{ matrix.health }}
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CRAFT_DB_DSN: ${{ matrix.dsn }}
      CRAFT_DB_USER: root
      CRAFT_DB_PASSWORD: root
      CRAFT_DB_SCHEMA: public
      CRAFT_DB_TABLE_PREFIX: ''
      CRAFT_SECURITY_KEY: translations-admin-tests
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, pdo_pgsql, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Tests
        run: composer test
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-php${{ matrix.php }}-${{ matrix.db }}
          path: |
            tests/_output
            tests/_craft/storage/logs

  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run production
